<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NZ Critical Links — road closure detour analysis</title>
    <meta
      name="description"
      content="Close a road link and see the shortest replacement path available in
               the represented New Zealand road network. Structural resilience
               analysis, not traffic assignment."
    />
    <!--
      The brand mark as an inline data URI: a closed link with the network
      routing around it. Inline rather than a file so nothing is fetched, which
      also removes the /favicon.ico 404 that a missing icon otherwise logs to
      the console on every page load.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23222a31'/%3E%3Cpath d='M5 18C7.5 18 8 6.5 12.5 6.5S18 13 19 13' fill='none' stroke='%232de1c2' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='m9 15 6-6' stroke='%23ff4d4d' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- The shell is graphite; tell the browser so it does not flash white. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b2127" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
