[project]
name = "nzcl"
version = "0.2.0"
description = "New Zealand road-network criticality and detour analysis over the NZTA AMDS Network Model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.32",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# mapbox-vector-tile is REQUIRED, not optional: the tile-contract test is the
# regression guard for a shipped P0 defect, and a skipped guard protects nothing.
#
# networkx is here for the same reason. It is the INDEPENDENT ORACLE that
# test_physical_oracle.py checks the physical-access graph against - bridges,
# articulation points, components, post-closure partitions. It must never be
# imported by anything under src/: the moment the engine and its oracle share
# code, agreement stops being evidence. It is a test dependency and only a test
# dependency.
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mapbox-vector-tile>=2.0",
    "networkx>=3.0",
]

[project.scripts]
nzcl-discover = "nzcl.cli:discover_main"
nzcl-ingest = "nzcl.cli:ingest_main"
nzcl-qa = "nzcl.cli:qa_main"
nzcl-detours = "nzcl.cli:batch_main"
nzcl-export = "nzcl.cli:export_main"
nzcl-names = "nzcl.cli:names_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite must never skip: a skipped regression guard protects
# nothing. Real-data checks that need an ingested snapshot are marked and
# deselected by default.
addopts = "-m 'not realdata'"
markers = [
  "realdata: needs a real ingested snapshot; not part of the mandatory suite",
]
filterwarnings = ["error::DeprecationWarning"]
