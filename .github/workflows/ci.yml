name: CI

# Checks that do not depend on anyone's laptop.
#
# Split deliberately into two jobs. `checks` needs nothing but the repository
# and so runs on every push in under a minute; `browser` provisions PostgreSQL,
# PostGIS and pgRouting, builds a snapshot and drives a real Chromium, which is
# slower and has more ways to fail. Keeping them apart means a type error is
# reported in a minute rather than behind a database build.

# A branch push and its pull request are the same code, and each was starting
# its own 36-minute browser job. `concurrency` did not collapse them because a
# push and a pull_request have different refs and so land in different groups.
# Running the heavy job once per PR is the fix; main still gets a run of its own
# on merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # 24, not 20: the install already warns that a dependency wants Node >= 22,
  # and 20 is out of support.
  NODE_VERSION: '24'

jobs:
  # Runs alone and needs nothing, so it reports in seconds. A leaked credential
  # is not a test failure - it is a disclosure, and every minute the other jobs
  # spend is a minute the object sits on the remote.
  #
  # The at-grade review packs embed a LINZ Basemaps key in every tile URL.
  # Generated pages were committed twice and purged twice by force-push, which
  # does not remove a pushed blob from the remote at all - it only makes it
  # unreachable. This guard is the control that "be careful next time" was not.
  secrets:
    name: No tracked credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard scans tracked files at this commit. It does not need
          # history, and fetching it would only slow the fastest signal here.
          fetch-depth: 1

      - name: Scan tracked files
        run: bash scripts/check-no-secrets.sh

  checks:
    name: Types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Type-checks core, the reference API and the web app. The web app was
      # once excluded here, which let three type errors sit in main unnoticed:
      # `vite build` transpiles without checking.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      # A build that silently stopped emitting the app would still "succeed".
      - name: Verify build output
        run: |
          test -f apps/web/dist/index.html
          test -d apps/web/dist/assets
          # Fonts must be bundled, not fetched from a CDN at runtime.
          ls apps/web/dist/assets/*.woff2 > /dev/null

  python:
    name: Python suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # One install path, from the controlled definition in
          # python/pyproject.toml. There used to be a
          # `|| pip install -r python/requirements-dev.txt` fallback here
          # pointing at a file that has never existed in this repository, so it
          # could only ever turn a real pip failure into a confusing
          # "no such file" one. A fallback that cannot succeed is not
          # resilience, it is a swallowed error.
          pip install -e './python[dev]'
          # Prove the dev extra actually resolved. A missing test-only
          # dependency otherwise surfaces as a collection error halfway through
          # the run, which reads like a broken test rather than a broken
          # install. networkx in particular is the independent oracle: without
          # it the strongest check in the suite silently stops running.
          python - <<'PY'
          # importlib.util is a submodule and is NOT imported by `import
          # importlib`. Getting that wrong here would fail the job with an
          # AttributeError that looks nothing like a dependency problem.
          import importlib.util
          import sys

          required = ("pytest", "httpx", "mapbox_vector_tile", "networkx")
          missing = [m for m in required if importlib.util.find_spec(m) is None]
          if missing:
              sys.exit("dev extra did not resolve, missing: " + ", ".join(missing))
          print("dev extra resolved:", " ".join(required))
          PY

      # `realdata` is deselected: those tests need a populated snapshot, which
      # the browser job provisions and this one deliberately does not.
      - name: Tests
        working-directory: python
        env:
          PYTHONPATH: src
        run: pytest -q -m "not realdata"

  browser:
    name: Browser flows and accessibility
    runs-on: ubuntu-latest
    # The heaviest job; do not start it if the cheap checks already failed.
    needs: checks

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nzcl
          POSTGRES_PASSWORD: nzcl_local_dev
          POSTGRES_DB: nzcl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nzcl -d nzcl"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nzcl:nzcl_local_dev@127.0.0.1:5432/nzcl
      API_PORT: '8000'
      NZCL_BASE_URL: http://127.0.0.1:5173
      NZCL_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install pgRouting
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker exec $(docker ps -qf ancestor=postgis/postgis:16-3.4) \
            bash -c "apt-get update && apt-get install -y postgresql-16-pgrouting"

      - name: Enable extensions
        run: |
          PGPASSWORD=nzcl_local_dev psql -h 127.0.0.1 -U nzcl -d nzcl \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgrouting;"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          # One install path, from the controlled definition in
          # python/pyproject.toml. There used to be a
          # `|| pip install -r python/requirements-dev.txt` fallback here
          # pointing at a file that has never existed in this repository, so it
          # could only ever turn a real pip failure into a confusing
          # "no such file" one. A fallback that cannot succeed is not
          # resilience, it is a swallowed error.
          pip install -e './python[dev]'
          # Prove the dev extra actually resolved. A missing test-only
          # dependency otherwise surfaces as a collection error halfway through
          # the run, which reads like a broken test rather than a broken
          # install. networkx in particular is the independent oracle: without
          # it the strongest check in the suite silently stops running.
          python - <<'PY'
          # importlib.util is a submodule and is NOT imported by `import
          # importlib`. Getting that wrong here would fail the job with an
          # AttributeError that looks nothing like a dependency problem.
          import importlib.util
          import sys

          required = ("pytest", "httpx", "mapbox_vector_tile", "networkx")
          missing = [m for m in required if importlib.util.find_spec(m) is None]
          if missing:
              sys.exit("dev extra did not resolve, missing: " + ", ".join(missing))
          print("dev extra resolved:", " ".join(required))
          PY

      - name: Apply schema
        working-directory: python
        env:
          PYTHONPATH: src
        run: python -c "from nzcl.db import migrate; print('\n'.join(migrate()))"

      # The browser suite needs a snapshot to query. It is built from a
      # synthetic network rather than downloaded, because CI must not depend on
      # the live NZTA feature service: it is not ours to depend on, an outage
      # there would fail unrelated pull requests, and an upstream change would
      # move the figures the tests assert against.
      #
      # The same loader builds the known-answer fixtures, so the network the
      # browser tests run against goes through the same junction splitting and
      # node assignment as production data.
      - name: Build the fixture snapshot
        working-directory: python
        env:
          PYTHONPATH: src
        run: python -m nzcl.fixtures build-ci-snapshot

      # The database-backed Python suite. This job is the only one with PostGIS
      # and pgRouting, and until now it went straight from building the fixture
      # to Playwright - so every `requires_db` test skipped in the fast Python
      # job and ran nowhere at all. 110 tests, including the whole V2 closure,
      # isolation, cache-identity and known-answer contract, had never executed
      # against a real database on CI.
      #
      # The preconditions are checked BEFORE pytest, because a green pytest run
      # proves nothing if the tests that matter silently skipped. The gate is
      # that these contracts EXECUTED, not that pytest returned zero.
      - name: Verify the database-backed preconditions
        working-directory: python
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import sys
          from nzcl import db

          problems = []

          try:
              db.query_one("SELECT 1 AS ok")
          except Exception as exc:
              sys.exit(f"no database reachable, so every db-backed test would "
                       f"skip and the job would still pass: {exc}")

          # Migrations 001-007, by the objects each one is responsible for.
          required = {
              "001_schema": ("links", "arcs", "nodes", "network_snapshots"),
              "002_arc_transitions": ("arc_transitions",),
              "003_coverage": (),
              "004_link_names": ("link_names", "road_name_candidates"),
              "005_external_name_sources": ("ext_road_names",),
              "006_name_source_licences": ("name_source_licences",),
              "007_physical_access": ("physical_access_runs",
                                      "physical_access_links",
                                      "physical_access_nodes",
                                      "closure_isolation_v2",
                                      "closure_analysis_v2",
                                      "closure_shadow_comparisons"),
          }
          for migration, tables in required.items():
              for t in tables:
                  row = db.query_one(
                      "SELECT to_regclass(%s) AS t", (f"public.{t}",))
                  if not row or row["t"] is None:
                      problems.append(f"{migration}: table {t} is missing")

          # migration 003 widens network_snapshots rather than adding a table.
          row = db.query_one(
              "SELECT column_name FROM information_schema.columns "
              " WHERE table_name='network_snapshots' AND column_name='coverage_kind'")
          if row is None:
              problems.append("003_coverage: network_snapshots.coverage_kind missing")

          snap = db.query_one(
              "SELECT snapshot_id, routable_link_count FROM network_snapshots "
              " WHERE snapshot_id='ci-fixture-wellington'")
          if snap is None:
              problems.append("the ci-fixture-wellington snapshot was not built")
          elif not snap["routable_link_count"]:
              problems.append("the ci-fixture-wellington snapshot has no links")

          if problems:
              sys.exit("database-backed preconditions failed:\n  "
                       + "\n  ".join(problems))

          print("database reachable, migrations 001-007 applied, "
                f"fixture snapshot present with {snap['routable_link_count']} links")
          PY

      - name: Python suite against real PostGIS
        working-directory: python
        env:
          PYTHONPATH: src
          # Turns any skip into a failure. On a runner WITH a database there is
          # no legitimate skip, so a silent degradation to the no-database path
          # cannot pass here.
          NZCL_REQUIRE_NO_SKIPS: '1'
        run: |
          set -o pipefail
          pytest -m "not realdata" --junitxml=/tmp/db-tests.xml -q

      # pytest's exit code says the assertions passed. It does not say WHICH
      # tests ran, and the failure this job exists to prevent is the
      # database-backed ones not running at all.
      - name: Prove the database-backed contracts executed
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          #: Modules whose tests need PostGIS. If any of these contributes zero
          #: executed tests, the database-backed gate is not gating anything.
          DB_MODULES = (
              "test_closure_v2", "test_closure_v2_identity",
              "test_closure_v2_components", "test_routing", "test_tiles",
              "test_fixture_contract",
              # The corridor timeout contract. Its database-backed half forces
              # real PostgreSQL cancellations, so it can only run in this job -
              # and a timeout guard that runs nowhere is the exact failure this
              # list exists to catch. Its status-mapping half needs no database
              # and so also runs in the fast Python job.
              "test_corridor_timeout",
          )

          root = ET.parse("/tmp/db-tests.xml").getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
          cases = [c for s in suites for c in s.iter("testcase")]
          if not cases:
              sys.exit("no tests were collected at all")

          def module_of(case):
              # pytest writes "tests.test_closure_v2.TestSomething". The module
              # is the last dotted part that still starts with "test_", which
              # survives both the package prefix and a class-less test.
              parts = [p for p in (case.get("classname") or "").split(".")
                       if p.startswith("test_")]
              return parts[-1] if parts else ""

          skipped = [c for c in cases if c.find("skipped") is not None]
          per_module = {}
          for c in cases:
              per_module.setdefault(module_of(c), 0)
              per_module[module_of(c)] += 1

          db_ran = {m: per_module.get(m, 0) for m in DB_MODULES}
          missing = [m for m, n in db_ran.items() if n == 0]

          total = len(cases)
          print(f"tests executed          : {total}")
          print(f"skipped                 : {len(skipped)}")
          print("database-backed modules :")
          for m, n in sorted(db_ran.items()):
              print(f"    {m:32} {n}")
          print(f"database-backed total   : {sum(db_ran.values())}")
          print("realdata tests are deselected by -m 'not realdata', by design: "
                "they need an ingested national snapshot, which CI must not "
                "download.")

          if skipped:
              for c in skipped:
                  print(f"  skipped: {module_of(c)}::{c.get('name')}")
              sys.exit(f"{len(skipped)} mandatory test(s) skipped on a runner "
                       f"that has a database")
          if missing:
              sys.exit("these database-backed modules contributed no executed "
                       "tests, so the gate proves nothing: " + ", ".join(missing))
          if sum(db_ran.values()) == 0:
              sys.exit("no database-backed test executed")
          PY

      - name: Start the API
        working-directory: python
        env:
          PYTHONPATH: src
          SNAPSHOT_ID: ci-fixture-wellington
        run: |
          nohup uvicorn nzcl.api:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || { cat /tmp/api.log; exit 1; }

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # No LINZ key in CI. The app must work without one — graphite ground, no
      # basemap, no glyphs — and the suite asserts the analytical network and
      # every result still render, which is the contract that matters.
      - name: Browser flows and accessibility scan
        run: npx playwright test

      - name: API log on failure
        if: failure()
        run: cat /tmp/api.log || true

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/.output
          retention-days: 7
